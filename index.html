<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="Coding Hub — Learn, take timed quizzes, track performance. AI-assisted feedback." />
  <title>Coding Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Coding Hub" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --muted-2: #94A3B8;
      --line: #E2E8F0;
      --indigo: #4F46E5;
      --indigo-dark: #4338CA;
      --indigo-soft: #EEF2FF;
      --green: #10B981;
      --green-soft: #D1FAE5;
      --red: #EF4444;
      --red-soft: #FEE2E2;
      --amber: #F59E0B;
      --amber-soft: #FEF3C7;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(15,23,42,0.06);
      --font: 'Inter', system-ui, sans-serif;
      --display: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; }
    .hidden { display: none !important; }

    /* AUTH */
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: linear-gradient(160deg, #EEF2FF 0%, #F8FAFC 50%, #F0FDF4 100%);
    }
    .auth-card {
      background: var(--surface); border-radius: 20px; padding: 36px 32px;
      width: 100%; max-width: 400px; box-shadow: var(--shadow); border: 1px solid var(--line);
    }
    .auth-logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
    }
    .auth-logo .mark {
      width: 42px; height: 42px; border-radius: 12px; background: var(--indigo);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-weight: 800; font-size: 16px;
    }
    .auth-logo h1 { font-family: var(--display); font-size: 1.35rem; font-weight: 800; }
    .auth-tabs { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 22px; }
    .auth-tab {
      flex: 1; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px;
      color: var(--muted); text-align: center; transition: all .15s;
    }
    .auth-tab.active { background: var(--surface); color: var(--indigo); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
      font-size: 14px; outline: none; background: var(--bg); transition: border-color .15s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--indigo); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px;
      transition: filter .15s, transform .1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--indigo); color: #fff; width: 100%; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
    .btn-danger { background: var(--red); color: #fff; }
    .form-msg { font-size: 13px; min-height: 18px; margin-top: 10px; }
    .form-msg.ok { color: var(--green); }
    .form-msg.err { color: var(--red); }

    /* APP SHELL */
    .app { display: none; min-height: 100vh; flex-direction: column; }
    .app.show { display: flex; }
    .topbar {
      display: flex; align-items: center; gap: 16px; padding: 12px 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 17px; }
    .brand .mark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--indigo);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .top-nav { display: flex; gap: 4px; margin-left: 24px; }
    .top-nav a {
      padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); transition: all .15s;
    }
    .top-nav a:hover, .top-nav a.active { background: var(--indigo-soft); color: var(--indigo); }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
      background: var(--bg); border-radius: 999px; font-size: 13px; font-weight: 600;
    }
    .user-pill .av {
      width: 30px; height: 30px; border-radius: 50%; background: var(--indigo);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .content { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 28px 20px 60px; }

    /* DASHBOARD */
    .page-title { font-family: var(--display); font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .page-sub { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow);
    }
    .stat-card .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-card .value { font-family: var(--display); font-size: 1.7rem; font-weight: 800; margin-top: 4px; }
    .stat-card .value.indigo { color: var(--indigo); }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.amber { color: var(--amber); }

    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-head h2 { font-family: var(--display); font-size: 1.15rem; font-weight: 700; }

    .lesson-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .lesson-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow); transition: box-shadow .2s, transform .15s;
      cursor: pointer; display: flex; flex-direction: column; gap: 10px;
    }
    .lesson-card:hover { box-shadow: 0 8px 28px rgba(15,23,42,0.1); transform: translateY(-2px); }
    .lesson-card .tag {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
      border-radius: 6px; background: var(--indigo-soft); color: var(--indigo); width: fit-content;
    }
    .lesson-card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.3; }
    .lesson-card p { font-size: 13.5px; color: var(--muted); flex: 1; }
    .lesson-card .meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12.5px; color: var(--muted-2); padding-top: 8px; border-top: 1px solid var(--line);
    }
    .lesson-card .status {
      font-weight: 600; font-size: 12px; padding: 3px 8px; border-radius: 6px;
    }
    .status.done { background: var(--green-soft); color: #059669; }
    .status.locked { background: var(--bg); color: var(--muted-2); }
    .status.open { background: var(--indigo-soft); color: var(--indigo); }

    /* LESSON VIEW */
    .lesson-view .back {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px;
      font-weight: 600; color: var(--muted); margin-bottom: 20px;
    }
    .lesson-view .back:hover { color: var(--indigo); }
    .lesson-body {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .lesson-body h2 { font-family: var(--display); font-size: 1.4rem; font-weight: 800; margin-bottom: 16px; }
    .lesson-body .content-html { font-size: 15px; line-height: 1.7; color: #334155; }
    .lesson-body .content-html h3 { font-size: 1.1rem; margin: 20px 0 10px; color: var(--text); }
    .lesson-body .content-html p { margin-bottom: 12px; }
    .lesson-body .content-html ul, .lesson-body .content-html ol { margin: 0 0 14px 20px; }
    .lesson-body .content-html code {
      background: #F1F5F9; padding: 2px 6px; border-radius: 4px; font-size: 13.5px;
    }
    .lesson-body .content-html pre {
      background: #0F172A; color: #E2E8F0; padding: 16px; border-radius: 10px;
      overflow-x: auto; font-size: 13.5px; margin: 14px 0;
    }
    .lesson-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    /* QUIZ */
    .quiz-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
    }
    .timer {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 12px; background: var(--amber-soft);
      font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: #B45309;
    }
    .timer.danger { background: var(--red-soft); color: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.7; } }
    .quiz-progress { font-size: 13.5px; font-weight: 600; color: var(--muted); }
    .question-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .question-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; line-height: 1.4; }
    .option {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 10px;
      cursor: pointer; transition: all .15s; background: var(--bg);
    }
    .option:hover { border-color: var(--indigo); background: var(--indigo-soft); }
    .option.selected { border-color: var(--indigo); background: var(--indigo-soft); }
    .option input { margin-top: 3px; accent-color: var(--indigo); }
    .option label { flex: 1; cursor: pointer; font-size: 14.5px; }

    /* RESULTS */
    .result-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 32px; text-align: center; box-shadow: var(--shadow); max-width: 480px; margin: 0 auto;
    }
    .result-card .score-big {
      font-family: var(--display); font-size: 3rem; font-weight: 800;
      color: var(--indigo); margin: 12px 0;
    }
    .result-card .pass { color: var(--green); }
    .result-card .fail { color: var(--red); }

    /* PROGRESS PAGE */
    .progress-table {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
      box-shadow: var(--shadow); font-size: 14px;
    }
    .progress-table th {
      text-align: left; padding: 12px 16px; background: var(--bg);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); border-bottom: 1px solid var(--line);
    }
    .progress-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .progress-table tr:last-child td { border-bottom: none; }

    /* AI PANEL */
    .ai-panel {
      background: linear-gradient(135deg, #EEF2FF, #F0FDF4);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; margin-top: 24px;
    }
    .ai-panel h3 { font-family: var(--display); font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .ai-panel textarea {
      width: 100%; min-height: 100px; padding: 12px; border-radius: 10px;
      border: 1px solid var(--line); font-size: 14px; margin-bottom: 12px; resize: vertical;
    }
    .ai-result {
      margin-top: 12px; padding: 14px; background: var(--surface); border-radius: 10px;
      font-size: 14px; line-height: 1.6; border: 1px solid var(--line); white-space: pre-wrap;
    }

    /* ADMIN */
    .admin-gate {
      max-width: 360px; margin: 80px auto; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
      box-shadow: var(--shadow); text-align: center;
    }
    .admin-panel .admin-section {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .admin-panel h3 { font-family: var(--display); font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }
    .admin-list { list-style: none; }
    .admin-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .admin-list li:last-child { border-bottom: none; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--text); color: #fff; padding: 12px 22px; border-radius: 12px;
      font-size: 14px; font-weight: 500; z-index: 500; opacity: 0; transition: all .3s;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 700px) {
      .top-nav { display: none; }
      .content { padding: 20px 16px 48px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- AUTH -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="mark">CH</div>
        <h1>Coding Hub</h1>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="login">Log in</button>
        <button class="auth-tab" data-auth="signup">Sign up</button>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
        <p class="form-msg" id="loginMsg"></p>
      </form>
      <form id="signupForm" class="hidden">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="signupName" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" required placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" required minlength="6" placeholder="Min 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
        <p class="form-msg" id="signupMsg"></p>
      </form>
      <button class="btn btn-ghost" style="width:100%;margin-top:12px" id="guestBtn">Continue as guest</button>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><div class="mark">CH</div> Coding Hub</div>
      <nav class="top-nav">
        <a href="#/" class="nav-link active" data-route="/">Dashboard</a>
        <a href="#/progress" class="nav-link" data-route="/progress">My Performance</a>
        <a href="#/ai" class="nav-link" data-route="/ai">AI Check</a>
      </nav>
      <div class="top-right">
        <div class="user-pill">
          <div class="av" id="userAv">U</div>
          <span id="userNameLabel">User</span>
        </div>
        <button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" id="logoutBtn">Logout</button>
      </div>
    </header>
    <main class="content" id="mainContent"></main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ========== CONFIG ========== */
    // Optional: paste your free Google Gemini API key (https://aistudio.google.com/apikey)
    const GEMINI_API_KEY = ''; // leave empty to disable AI until you add a key
    // Secret admin password (change this!)
    const ADMIN_PASSWORD = 'codinghub-admin-2026';

    /* ========== DATA (lessons + quizzes) ========== */
    const COURSES = [
      {
        id: 'html-1',
        title: 'HTML Basics: Structure',
        tag: 'HTML',
        duration: '8 min',
        order: 1,
        content: `
          <h3>What is HTML?</h3>
          <p>HTML (HyperText Markup Language) is the standard language for creating web pages. It describes the structure of a page using elements (tags).</p>
          <h3>Basic document structure</h3>
          <pre>&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;My Page&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
  &lt;/body&gt;
&lt;/html&gt;</pre>
          <h3>Key tags</h3>
          <ul>
            <li><code>&lt;h1&gt;</code> to <code>&lt;h6&gt;</code> — headings</li>
            <li><code>&lt;p&gt;</code> — paragraphs</li>
            <li><code>&lt;a href=""&gt;</code> — links</li>
            <li><code>&lt;img src=""&gt;</code> — images</li>
          </ul>
          <p>Every HTML page needs a doctype, html, head and body.</p>
        `,
        quiz: {
          timeLimitSec: 120,
          questions: [
            {
              q: 'What does HTML stand for?',
              options: ['HyperText Markup Language', 'High Tech Modern Language', 'Home Tool Markup Language', 'Hyperlink and Text Markup Language'],
              correct: 0
            },
            {
              q: 'Which tag is used for the largest heading?',
              options: ['<h6>', '<heading>', '<h1>', '<head>'],
              correct: 2
            },
            {
              q: 'Which of these is required at the top of an HTML5 document?',
              options: ['<DOCTYPE html>', '<!DOCTYPE html>', '<doctype HTML>', 'None'],
              correct: 1
            }
          ]
        }
      },
      {
        id: 'html-2',
        title: 'HTML: Lists, Tables & Forms',
        tag: 'HTML',
        duration: '10 min',
        order: 2,
        content: `
          <h3>Lists</h3>
          <p>Unordered lists use <code>&lt;ul&gt;</code> and <code>&lt;li&gt;</code>. Ordered lists use <code>&lt;ol&gt;</code>.</p>
          <h3>Tables</h3>
          <p>Tables are built with <code>&lt;table&gt;</code>, <code>&lt;tr&gt;</code> (row), <code>&lt;th&gt;</code> (header cell) and <code>&lt;td&gt;</code> (data cell).</p>
          <h3>Forms</h3>
          <p>Forms collect user input. Key elements:</p>
          <ul>
            <li><code>&lt;form action="" method=""&gt;</code></li>
            <li><code>&lt;input type="text"&gt;</code>, <code>email</code>, <code>password</code>, <code>submit</code></li>
            <li><code>&lt;textarea&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;button&gt;</code></li>
          </ul>
        `,
        quiz: {
          timeLimitSec: 90,
          questions: [
            {
              q: 'Which tag creates an unordered list?',
              options: ['<ol>', '<ul>', '<li>', '<list>'],
              correct: 1
            },
            {
              q: 'Which input type is best for an email field?',
              options: ['type="text"', 'type="email"', 'type="mail"', 'type="submit"'],
              correct: 1
            },
            {
              q: 'What does <tr> stand for in a table?',
              options: ['Table row', 'Table rule', 'Text row', 'Table result'],
              correct: 0
            }
          ]
        }
      },
      {
        id: 'css-1',
        title: 'CSS Fundamentals',
        tag: 'CSS',
        duration: '9 min',
        order: 3,
        content: `
          <h3>What is CSS?</h3>
          <p>CSS (Cascading Style Sheets) controls how HTML elements look: colors, layout, fonts, spacing.</p>
          <h3>Three ways to add CSS</h3>
          <ol>
            <li>Inline — <code>style="color:red"</code></li>
            <li>Internal — <code>&lt;style&gt;</code> in the head</li>
            <li>External — separate <code>.css</code> file (best practice)</li>
          </ol>
          <h3>Selectors</h3>
          <pre>h1 { color: blue; }
.my-class { font-size: 18px; }
#main { max-width: 800px; }</pre>
          <p>Use classes for reusable styles and IDs for unique elements.</p>
        `,
        quiz: {
          timeLimitSec: 90,
          questions: [
            {
              q: 'What does CSS stand for?',
              options: ['Computer Style Sheets', 'Cascading Style Sheets', 'Creative Style System', 'Colorful Style Sheets'],
              correct: 1
            },
            {
              q: 'Which is the correct way to select an element with class "box"?',
              options: ['#box', '.box', 'box', '*box'],
              correct: 1
            },
            {
              q: 'Which property changes text color?',
              options: ['font-color', 'text-color', 'color', 'fgcolor'],
              correct: 2
            }
          ]
        }
      },
      {
        id: 'js-1',
        title: 'JavaScript Basics',
        tag: 'JavaScript',
        duration: '10 min',
        order: 4,
        content: `
          <h3>What is JavaScript?</h3>
          <p>JavaScript makes web pages interactive. It runs in the browser and can change content, respond to clicks, validate forms, and more.</p>
          <h3>Variables</h3>
          <pre>let name = "Coding Hub";
const year = 2026;
var oldStyle = true; // avoid var</pre>
          <h3>Functions</h3>
          <pre>function greet(person) {
  return "Hello, " + person;
}
console.log(greet("Rwanda"));</pre>
          <p>Use <code>let</code> and <code>const</code>. Prefer <code>const</code> when the value does not change.</p>
        `,
        quiz: {
          timeLimitSec: 100,
          questions: [
            {
              q: 'Which keyword declares a variable that cannot be reassigned?',
              options: ['var', 'let', 'const', 'static'],
              correct: 2
            },
            {
              q: 'How do you write a single-line comment in JavaScript?',
              options: ['<!-- comment -->', '// comment', '/* comment', '# comment'],
              correct: 1
            },
            {
              q: 'What does console.log() do?',
              options: ['Shows an alert', 'Prints to the browser console', 'Creates a log file', 'Stops the script'],
              correct: 1
            }
          ]
        }
      }
    ];

    /* ========== STATE ========== */
    let currentUser = null;
    // progress shape: { [lessonId]: { completed: bool, quizScore: number|null, quizTotal: number, attempted: bool, date: string } }
    let progress = {};

    function loadProgress() {
      try {
        const key = 'ch_progress_' + (currentUser?.email || 'guest');
        progress = JSON.parse(localStorage.getItem(key) || '{}');
      } catch { progress = {}; }
    }
    function saveProgress() {
      const key = 'ch_progress_' + (currentUser?.email || 'guest');
      localStorage.setItem(key, JSON.stringify(progress));
    }

    function getOverallStats() {
      const totalLessons = COURSES.length;
      let completed = 0, totalEarned = 0, totalPossible = 0, quizzesTaken = 0;
      COURSES.forEach(c => {
        const p = progress[c.id];
        if (p?.completed) completed++;
        if (p?.attempted && p.quizScore != null) {
          quizzesTaken++;
          totalEarned += p.quizScore;
          totalPossible += p.quizTotal;
        }
      });
      const avg = totalPossible ? Math.round((totalEarned / totalPossible) * 100) : 0;
      return { totalLessons, completed, quizzesTaken, avg, totalEarned, totalPossible };
    }

    /* ========== TOAST ========== */
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    /* ========== AUTH ========== */
    function enterApp(user) {
      currentUser = user;
      loadProgress();
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('app').classList.add('show');
      const name = user.name || user.email?.split('@')[0] || 'Guest';
      document.getElementById('userNameLabel').textContent = name;
      document.getElementById('userAv').textContent = name[0].toUpperCase();
      route();
    }
    function stayOnAuth() {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('app').classList.remove('show');
    }

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('loginForm').classList.toggle('hidden', tab.dataset.auth !== 'login');
        document.getElementById('signupForm').classList.toggle('hidden', tab.dataset.auth !== 'signup');
      });
    });

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('loginMsg');
      // Local demo auth (replace with Supabase later if needed)
      const users = JSON.parse(localStorage.getItem('ch_users') || '{}');
      if (users[email] && users[email].password === password) {
        localStorage.setItem('ch_session', JSON.stringify({ email, name: users[email].name }));
        msg.className = 'form-msg ok'; msg.textContent = 'Welcome back!';
        setTimeout(() => enterApp({ email, name: users[email].name }), 400);
      } else if (email && password) {
        // allow any for demo convenience
        localStorage.setItem('ch_session', JSON.stringify({ email, name: email.split('@')[0] }));
        msg.className = 'form-msg ok'; msg.textContent = 'Logged in';
        setTimeout(() => enterApp({ email, name: email.split('@')[0] }), 400);
      } else {
        msg.className = 'form-msg err'; msg.textContent = 'Invalid credentials';
      }
    });

    document.getElementById('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const msg = document.getElementById('signupMsg');
      const users = JSON.parse(localStorage.getItem('ch_users') || '{}');
      if (users[email]) {
        msg.className = 'form-msg err'; msg.textContent = 'Email already registered';
        return;
      }
      users[email] = { name, password };
      localStorage.setItem('ch_users', JSON.stringify(users));
      localStorage.setItem('ch_session', JSON.stringify({ email, name }));
      msg.className = 'form-msg ok'; msg.textContent = 'Account created!';
      setTimeout(() => enterApp({ email, name }), 400);
    });

    document.getElementById('guestBtn').addEventListener('click', () => {
      localStorage.setItem('ch_session', JSON.stringify({ mode: 'guest', name: 'Guest' }));
      enterApp({ name: 'Guest', email: 'guest' });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('ch_session');
      stayOnAuth();
    });

    /* ========== ROUTER ========== */
    function route() {
      const hash = location.hash.slice(1) || '/';
      const parts = hash.split('/').filter(Boolean);
      document.querySelectorAll('.nav-link').forEach(a => {
        a.classList.toggle('active', a.dataset.route === '/' + (parts[0] || '') || (parts.length === 0 && a.dataset.route === '/'));
      });

      if (parts[0] === 'lesson' && parts[1]) renderLesson(parts[1]);
      else if (parts[0] === 'quiz' && parts[1]) renderQuiz(parts[1]);
      else if (parts[0] === 'result' && parts[1]) renderResult(parts[1]);
      else if (parts[0] === 'progress') renderProgress();
      else if (parts[0] === 'ai') renderAI();
      else if (parts[0] === 'admin') renderAdmin();
      else renderDashboard();
    }
    window.addEventListener('hashchange', route);

    /* ========== VIEWS ========== */
    function renderDashboard() {
      const stats = getOverallStats();
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">Short lessons → timed quizzes → track your marks. No quiz retries.</p>
        <div class="stats-row">
          <div class="stat-card"><div class="label">Lessons done</div><div class="value indigo">${stats.completed}/${stats.totalLessons}</div></div>
          <div class="stat-card"><div class="label">Quizzes taken</div><div class="value">${stats.quizzesTaken}</div></div>
          <div class="stat-card"><div class="label">Average score</div><div class="value green">${stats.avg}%</div></div>
          <div class="stat-card"><div class="label">Total marks</div><div class="value amber">${stats.totalEarned}/${stats.totalPossible || '—'}</div></div>
        </div>
        <div class="section-head"><h2>Lessons</h2></div>
        <div class="lesson-grid" id="lessonGrid"></div>
      `;
      const grid = document.getElementById('lessonGrid');
      COURSES.sort((a, b) => a.order - b.order).forEach(c => {
        const p = progress[c.id] || {};
        let status = 'open', statusText = 'Start';
        if (p.attempted) { status = 'done'; statusText = `Quiz: ${p.quizScore}/${p.quizTotal}`; }
        else if (p.completed) { status = 'open'; statusText = 'Take quiz'; }
        const card = document.createElement('article');
        card.className = 'lesson-card';
        card.innerHTML = `
          <span class="tag">${c.tag}</span>
          <h3>${c.title}</h3>
          <p>Short lesson + timed quiz. Score counts toward your total marks.</p>
          <div class="meta">
            <span>${c.duration} · ${c.quiz.questions.length} questions</span>
            <span class="status ${status}">${statusText}</span>
          </div>
        `;
        card.addEventListener('click', () => location.hash = '#/lesson/' + c.id);
        grid.appendChild(card);
      });
    }

    function renderLesson(id) {
      const course = COURSES.find(c => c.id === id);
      if (!course) { location.hash = '#/'; return; }
      const p = progress[id] || {};
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="lesson-view">
          <a href="#/" class="back">← Back to dashboard</a>
          <div class="lesson-body">
            <span class="tag" style="display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--indigo-soft);color:var(--indigo);margin-bottom:12px">${course.tag}</span>
            <h2>${course.title}</h2>
            <div class="content-html">${course.content}</div>
          </div>
          <div class="lesson-actions">
            ${p.attempted
              ? `<button class="btn btn-ghost" disabled>Quiz already taken (no retry)</button>
                 <a href="#/result/${id}" class="btn btn-primary">View result</a>`
              : `<button class="btn btn-primary" id="startQuizBtn">Start timed quiz (${course.quiz.timeLimitSec}s)</button>`
            }
            <button class="btn btn-ghost" id="markReadBtn">Mark lesson as read</button>
          </div>
        </div>
      `;
      document.getElementById('markReadBtn')?.addEventListener('click', () => {
        if (!progress[id]) progress[id] = {};
        progress[id].completed = true;
        saveProgress();
        toast('Lesson marked as read');
      });
      document.getElementById('startQuizBtn')?.addEventListener('click', () => {
        if (!progress[id]) progress[id] = {};
        progress[id].completed = true;
        saveProgress();
        location.hash = '#/quiz/' + id;
      });
    }

    /* ========== QUIZ (timed, no retry) ========== */
    let quizTimer = null;
    let quizAnswers = {};
    let quizRemaining = 0;

    function renderQuiz(id) {
      const course = COURSES.find(c => c.id === id);
      if (!course) { location.hash = '#/'; return; }
      if (progress[id]?.attempted) {
        toast('You already took this quiz. No retries allowed.');
        location.hash = '#/result/' + id;
        return;
      }

      quizAnswers = {};
      quizRemaining = course.quiz.timeLimitSec;
      const questions = course.quiz.questions;
      const main = document.getElementById('mainContent');

      main.innerHTML = `
        <div class="quiz-header">
          <div>
            <h1 class="page-title" style="margin:0;font-size:1.3rem">${course.title} — Quiz</h1>
            <div class="quiz-progress">${questions.length} questions · No retry</div>
          </div>
          <div class="timer" id="quizTimer">${formatTime(quizRemaining)}</div>
        </div>
        <form id="quizForm"></form>
        <div style="margin-top:20px;display:flex;gap:12px">
          <button type="button" class="btn btn-primary" id="submitQuizBtn">Submit quiz</button>
        </div>
      `;

      const form = document.getElementById('quizForm');
      questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `<h3>${i + 1}. ${q.q}</h3>`;
        q.options.forEach((opt, j) => {
          const oid = `q${i}_o${j}`;
          const div = document.createElement('div');
          div.className = 'option';
          div.innerHTML = `
            <input type="radio" name="q${i}" id="${oid}" value="${j}" />
            <label for="${oid}">${opt.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</label>
          `;
          div.addEventListener('click', () => {
            div.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            div.classList.add('selected');
            document.getElementById(oid).checked = true;
            quizAnswers[i] = j;
          });
          card.appendChild(div);
        });
        form.appendChild(card);
      });

      // Timer
      clearInterval(quizTimer);
      quizTimer = setInterval(() => {
        quizRemaining--;
        const el = document.getElementById('quizTimer');
        if (el) {
          el.textContent = formatTime(quizRemaining);
          if (quizRemaining <= 15) el.classList.add('danger');
        }
        if (quizRemaining <= 0) {
          clearInterval(quizTimer);
          finishQuiz(id, true);
        }
      }, 1000);

      document.getElementById('submitQuizBtn').addEventListener('click', () => finishQuiz(id, false));
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function finishQuiz(id, auto) {
      clearInterval(quizTimer);
      const course = COURSES.find(c => c.id === id);
      if (!course || progress[id]?.attempted) return;

      let score = 0;
      course.quiz.questions.forEach((q, i) => {
        if (quizAnswers[i] === q.correct) score++;
      });
      const total = course.quiz.questions.length;

      progress[id] = {
        completed: true,
        attempted: true,
        quizScore: score,
        quizTotal: total,
        date: new Date().toISOString()
      };
      saveProgress();

      if (auto) toast('Time is up! Quiz auto-submitted.');
      location.hash = '#/result/' + id;
    }

    function renderResult(id) {
      const course = COURSES.find(c => c.id === id);
      const p = progress[id];
      if (!course || !p?.attempted) { location.hash = '#/'; return; }
      const pct = Math.round((p.quizScore / p.quizTotal) * 100);
      const passed = pct >= 50;
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="result-card">
          <div style="font-size:14px;font-weight:600;color:var(--muted)">${course.title}</div>
          <div class="score-big ${passed ? 'pass' : 'fail'}">${p.quizScore}/${p.quizTotal}</div>
          <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">${pct}% — ${passed ? 'Passed' : 'Needs improvement'}</div>
          <p style="color:var(--muted);font-size:14px;margin-bottom:24px">
            This score is locked and added to your total marks. No retries.
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="#/" class="btn btn-primary">Back to dashboard</a>
            <a href="#/progress" class="btn btn-ghost">View performance</a>
          </div>
        </div>
      `;
    }

    function renderProgress() {
      const stats = getOverallStats();
      const main = document.getElementById('mainContent');
      let rows = '';
      COURSES.sort((a, b) => a.order - b.order).forEach(c => {
        const p = progress[c.id] || {};
        const score = p.attempted ? `${p.quizScore}/${p.quizTotal} (${Math.round(p.quizScore / p.quizTotal * 100)}%)` : '—';
        const status = p.attempted ? 'Completed' : (p.completed ? 'Read only' : 'Not started');
        const date = p.date ? new Date(p.date).toLocaleDateString() : '—';
        rows += `<tr>
          <td><strong>${c.title}</strong><br><span style="font-size:12px;color:var(--muted)">${c.tag}</span></td>
          <td>${status}</td>
          <td>${score}</td>
          <td>${date}</td>
        </tr>`;
      });
      main.innerHTML = `
        <h1 class="page-title">My Performance</h1>
        <p class="page-sub">All quiz scores are permanent and count toward your total marks.</p>
        <div class="stats-row">
          <div class="stat-card"><div class="label">Average</div><div class="value green">${stats.avg}%</div></div>
          <div class="stat-card"><div class="label">Total marks</div><div class="value indigo">${stats.totalEarned} / ${stats.totalPossible || 0}</div></div>
          <div class="stat-card"><div class="label">Quizzes taken</div><div class="value">${stats.quizzesTaken}</div></div>
        </div>
        <table class="progress-table">
          <thead><tr><th>Lesson</th><th>Status</th><th>Quiz score</th><th>Date</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    /* ========== AI (Google Gemini free API) ========== */
    async function callGemini(prompt) {
      if (!GEMINI_API_KEY) {
        return 'AI is not configured yet.\n\n1. Get a free API key at https://aistudio.google.com/apikey\n2. Paste it into GEMINI_API_KEY in index.html\n3. Reload the page.';
      }
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.3, maxOutputTokens: 800 }
            })
          }
        );
        const data = await res.json();
        if (data.error) return 'API error: ' + (data.error.message || JSON.stringify(data.error));
        return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from AI.';
      } catch (err) {
        return 'Network error: ' + err.message;
      }
    }

    function renderAI() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <h1 class="page-title">AI Check</h1>
        <p class="page-sub">Paste code or an answer. The free Google Gemini API will review it for correctness, style, and possible issues.</p>
        <div class="ai-panel">
          <h3>Code / Answer detector & feedback</h3>
          <textarea id="aiInput" placeholder="Paste HTML, CSS, JavaScript, or a written answer here..."></textarea>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" id="aiReviewBtn">Review with AI</button>
            <button class="btn btn-ghost" id="aiDetectBtn">Detect language / issues</button>
          </div>
          <div class="ai-result hidden" id="aiResult"></div>
        </div>
      `;
      const resultEl = document.getElementById('aiResult');
      const run = async (mode) => {
        const text = document.getElementById('aiInput').value.trim();
        if (!text) { toast('Paste something first'); return; }
        resultEl.classList.remove('hidden');
        resultEl.textContent = 'Thinking…';
        const prompt = mode === 'detect'
          ? `You are a coding tutor for beginners in Rwanda. Analyze this snippet. Reply with:\n1) Detected language\n2) Any syntax or logic issues\n3) One short improvement tip\n\nCode:\n${text}`
          : `You are a strict but helpful coding instructor. Review this student submission. Give:\n- Correctness (pass/fail style)\n- What is good\n- What to fix\n- A corrected version if needed (short)\n\nSubmission:\n${text}`;
        const out = await callGemini(prompt);
        resultEl.textContent = out;
      };
      document.getElementById('aiReviewBtn').addEventListener('click', () => run('review'));
      document.getElementById('aiDetectBtn').addEventListener('click', () => run('detect'));
    }

    /* ========== SECRET ADMIN ========== */
    function renderAdmin() {
      const main = document.getElementById('mainContent');
      const unlocked = sessionStorage.getItem('ch_admin') === '1';

      if (!unlocked) {
        main.innerHTML = `
          <div class="admin-gate">
            <h2 style="font-family:var(--display);font-weight:800;margin-bottom:8px">Admin</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:18px">Enter the secret password</p>
            <div class="form-group">
              <input type="password" id="adminPass" placeholder="Password" />
            </div>
            <button class="btn btn-primary" id="adminUnlock">Unlock</button>
            <p class="form-msg" id="adminMsg"></p>
          </div>
        `;
        document.getElementById('adminUnlock').addEventListener('click', () => {
          const pass = document.getElementById('adminPass').value;
          if (pass === ADMIN_PASSWORD) {
            sessionStorage.setItem('ch_admin', '1');
            renderAdmin();
          } else {
            document.getElementById('adminMsg').className = 'form-msg err';
            document.getElementById('adminMsg').textContent = 'Wrong password';
          }
        });
        return;
      }

      // Collect all local users progress for overview
      let studentRows = '';
      try {
        const users = JSON.parse(localStorage.getItem('ch_users') || '{}');
        Object.keys(users).forEach(email => {
          const key = 'ch_progress_' + email;
          const pr = JSON.parse(localStorage.getItem(key) || '{}');
          let scores = 0, possible = 0, taken = 0;
          Object.values(pr).forEach(p => {
            if (p.attempted) { taken++; scores += p.quizScore; possible += p.quizTotal; }
          });
          const avg = possible ? Math.round(scores / possible * 100) : 0;
          studentRows += `<li><span>${users[email].name || email}</span><span>${taken} quizzes · ${avg}% avg</span></li>`;
        });
      } catch {}

      main.innerHTML = `
        <div class="admin-panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h1 class="page-title" style="margin:0">Admin panel</h1>
            <button class="btn btn-ghost" id="adminLock">Lock</button>
          </div>
          <div class="admin-section">
            <h3>Lessons & quizzes</h3>
            <ul class="admin-list">
              ${COURSES.map(c => `<li><span>${c.order}. ${c.title}</span><span>${c.quiz.questions.length} Q · ${c.quiz.timeLimitSec}s</span></li>`).join('')}
            </ul>
            <p style="font-size:13px;color:var(--muted);margin-top:12px">To edit lessons, change the COURSES array in index.html and redeploy.</p>
          </div>
          <div class="admin-section">
            <h3>Registered students (local)</h3>
            <ul class="admin-list">
              ${studentRows || '<li><span>No registered students yet</span></li>'}
            </ul>
          </div>
          <div class="admin-section">
            <h3>Quick stats</h3>
            <p style="font-size:14px">Total lessons: <strong>${COURSES.length}</strong></p>
            <p style="font-size:14px;margin-top:6px">Admin password is set in code (ADMIN_PASSWORD). Change it before going live.</p>
          </div>
        </div>
      `;
      document.getElementById('adminLock').addEventListener('click', () => {
        sessionStorage.removeItem('ch_admin');
        location.hash = '#/';
      });
    }

    /* ========== BOOT ========== */
    (function boot() {
      let session = null;
      try { session = JSON.parse(localStorage.getItem('ch_session') || 'null'); } catch {}
      if (session) enterApp(session);
      else stayOnAuth();
    })();

    // PWA service worker
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
